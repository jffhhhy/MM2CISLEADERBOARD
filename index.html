<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MM2 CIS Leaderboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: #0b0713;
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(120, 40, 140, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(230, 50, 110, 0.1) 0%, transparent 40%);
            color: #ffffff;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        /* Шапка сайта */
        header {
            text-align: center;
            margin-bottom: 35px;
        }

        h1 {
            font-size: 2.8rem;
            font-weight: 800;
            text-transform: uppercase;
            background: linear-gradient(90deg, #ff416c, #ff4b2b, #b224ef);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
            margin-bottom: 8px;
            text-shadow: 0 0 30px rgba(255, 65, 108, 0.3);
        }

        .subtitle {
            font-size: 0.95rem;
            color: #8c82a9;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 600;
        }

        /* Панель управления (поиск и кнопка) */
        .control-panel {
            background: rgba(22, 17, 35, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 16px;
            padding: 24px;
            display: flex;
            gap: 15px;
            align-items: flex-end;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .input-group {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-group label {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: #8c82a9;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .input-group input {
            background: #110c1f;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 12px 16px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            border-color: #ff416c;
            box-shadow: 0 0 10px rgba(255, 65, 108, 0.2);
        }

        .update-btn {
            background: linear-gradient(135deg, #ff416c, #b224ef);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 13px 28px;
            font-weight: 700;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 65, 108, 0.4);
            height: 46px;
        }

        .update-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 65, 108, 0.6);
        }

        .update-btn:active {
            transform: translateY(0);
        }

        /* Таблица */
        .leaderboard-table {
            background: rgba(22, 17, 35, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 16px;
            overflow: hidden;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .table-header {
            display: grid;
            grid-template-columns: 100px 1fr;
            padding: 16px 24px;
            font-size: 0.75rem;
            text-transform: uppercase;
            color: #8c82a9;
            font-weight: 700;
            letter-spacing: 1px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .table-body {
            max-height: 500px;
            overflow-y: auto;
        }

        .table-body::-webkit-scrollbar {
            width: 6px;
        }

        .table-body::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }

        .player-row {
            display: grid;
            grid-template-columns: 100px 1fr;
            padding: 14px 24px;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            transition: background 0.2s ease;
        }

        .player-row:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        /* Выделение топ-1 как на картинке */
        .player-row.top-1 {
            background: rgba(255, 180, 0, 0.05);
            border-left: 4px solid #ffb400;
            border-bottom: 1px solid rgba(255, 180, 0, 0.1);
        }

        .rank-num {
            font-weight: 700;
            font-size: 1rem;
            color: #b0a8c2;
        }

        .top-1 .rank-num { color: #ffb400; }
        .top-2 .rank-num { color: #e0e0e0; }
        .top-3 .rank-num { color: #cd7f32; }

        .player-name {
            font-weight: 600;
            font-size: 0.95rem;
            color: #fff;
        }

        .top-1 .player-name { color: #ffca28; }

        .no-results {
            text-align: center;
            padding: 30px;
            color: #8c82a9;
            font-size: 0.9rem;
        }

        @media (max-width: 600px) {
            .control-panel {
                flex-direction: column;
                align-items: stretch;
            }
            .update-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>MM2 CIS Leaderboard</h1>
            <div class="subtitle">Season 2026 • Top 100 Players</div>
        </header>

        <div class="control-panel">
            <div class="input-group">
                <label for="rankSearch">Rank (1-100)</label>
                <input type="number" id="rankSearch" placeholder="e.g. 1" min="1" max="100">
            </div>
            <div class="input-group">
                <label for="nameSearch">Player Nickname</label>
                <input type="text" id="nameSearch" placeholder="Enter username...">
            </div>
            <button class="update-btn" onclick="updateLeaderboard()">Update Rank</button>
        </div>

        <div class="leaderboard-table">
            <div class="table-header">
                <div>Rank</div>
                <div>Player</div>
            </div>
            <div class="table-body" id="tableBody">
                <!-- Сюда через JS загружаются игроки -->
            </div>
        </div>
    </div>

    <script>
        // Генерируем тестовый список топ-100 игроков для примера
        const playersData = [
            { rank: 1, name: "Nikita_MM2" },
            { rank: 2, name: "Slayer_CIS" },
            { rank: 3, name: "ShadowX" },
            { rank: 4, name: "ProGamer_2006" },
            { rank: 5, name: "Vortex_MM2" },
            { rank: 6, name: "Blaze" },
            { rank: 7, name: "Ghost_Rider" },
            { rank: 8, name: "Sniperski" },
            { rank: 9, name: "Eclipse" },
            { rank: 10, name: "NeonGod" }
        ];

        // Заполняем до 100 игроков для демонстрации
        for (let i = 11; i <= 100; i++) {
            playersData.push({ rank: i, name: `Player_MM2_${i}` });
        }

        function renderTable(dataToRender) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            if (dataToRender.length === 0) {
                tbody.innerHTML = '<div class="no-results">Игроки не найдены</div>';
                return;
            }

            dataToRender.forEach(player => {
                const row = document.createElement('div');
                row.className = `player-row top-${player.rank}`;
                
                let rankDisplay = player.rank;
                if (player.rank === 1) rankDisplay = '1 🥇';
                else if (player.rank === 2) rankDisplay = '2 🥈';
                else if (player.rank === 3) rankDisplay = '3 🥉';

                row.innerHTML = `
                    <div class="rank-num">${rankDisplay}</div>
                    <div class="player-name">${player.name}</div>
                `;
                tbody.appendChild(row);
            });
        }

        function updateLeaderboard() {
            const rankVal = document.getElementById('rankSearch').value.trim();
            const nameVal = document.getElementById('nameSearch').value.trim().toLowerCase();

            let filtered = playersData;

            if (rankVal !== '') {
                filtered = filtered.filter(p => p.rank.toString() === rankVal);
            }

            if (nameVal !== '') {
                filtered = filtered.filter(p => p.name.toLowerCase().includes(nameVal));
            }

            renderTable(filtered);
        }

        // Рендерим всю таблицу при загрузке страницы
        renderTable(playersData);
    </script>
</body>
</html>
